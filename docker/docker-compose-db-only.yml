---
services:
  jmeros-postgresql-db:
    image: postgres:18.7
    container_name: jmeros-postgresql-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=db-user
      - POSTGRES_PASSWORD=db-pass
      - POSTGRES_DB=reaction-observer-db

  # Database of jme-ros-partner-service
  jmeros-partner-db:
    image: postgres:18.7
    container_name: jmeros-partner-db
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=db-user
      - POSTGRES_PASSWORD=db-pass
      - POSTGRES_DB=partner-db
