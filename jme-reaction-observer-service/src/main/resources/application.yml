spring:
  application:
    name: jme-reaction-observer-service

  jpa:
    database: postgresql
    show-sql: false
    generate-ddl: false
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: data

  flyway:
    enabled: true
    locations: classpath:db/migration/common
    default-schema: data

  main:
    banner-mode: off

server:
  servlet:
    context-path: /${spring.application.name}

jeap:
  web.tls.enabled: false
  swagger:
    status: open
  security:
    oauth2:
      resourceserver:
        # Required: the service refuses to start without an authorization server and a system name, because
        # its API accepts OAuth2 bearer tokens only, authorized by the semantic roles 'jme_@reactions_#read'
        # and 'jme_@reactions_#write'. This example points at the jEAP OAuth mock server of the module
        # jme-reaction-observer-auth-scs; since the JWKS is only fetched once a request actually carries a
        # bearer token, the service starts with no mock running at all.
        system-name: jme
        authorization-server:
          issuer: "http://localhost:8180/jme-reaction-observer-auth-scs"
          jwk-set-uri: "http://localhost:8180/jme-reaction-observer-auth-scs/.well-known/jwks.json"
  reaction:
    observer:
      service:
        kafka:
          reaction-identified-topic: jme-reaction-identified
          reactions-observed-topic: jme-reactions-observed

database-migration:
  startup-migrate-mode-enabled: true
  init-container: false

logging:
  level:
    ch.admin.bit.jeap.reaction: DEBUG
