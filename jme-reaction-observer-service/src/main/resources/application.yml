spring:
  application:
    name: jme-reaction-observer-service

  jpa:
    database: postgresql
    show-sql: false
    generate-ddl: false
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: data

  flyway:
    enabled: true
    locations: classpath:db/migration/common
    default-schema: data

  main:
    banner-mode: off

server:
  servlet:
    context-path: /${spring.application.name}

jeap:
  web.tls.enabled: false
  swagger:
    status: open
  security:
    oauth2:
      resourceserver:
        # Required as of jeap-reaction-observer-service 11.0.0: the service refuses to start without an
        # authorization server and a system name, because its API is authenticated with HTTP Basic and with
        # bearer tokens and both have to work. This example points at a local jEAP OAuth mock server
        # (jeap-oauth-mock-server, port 8180 by default); since the JWKS is only fetched once a request
        # actually carries a bearer token, the service starts - and the HTTP Basic users below keep working -
        # with no mock running at all.
        system-name: jme
        authorization-server:
          issuer: "http://localhost:8180"
          jwk-set-uri: "http://localhost:8180/.well-known/jwks.json"
  reaction:
    observer:
      service:
        kafka:
          reaction-identified-topic: jme-reaction-identified
          reactions-observed-topic: jme-reactions-observed
      read-user:
        username: read
        password: "{noop}secret"
      write-user:
        username: write
        password: "{noop}secret"

database-migration:
  startup-migrate-mode-enabled: true
  init-container: false

logging:
  level:
    ch.admin.bit.jeap.reaction: DEBUG
