spring:
  application:
    name: jme-reaction-observer-service

  jpa:
    database: postgresql
    show-sql: false
    generate-ddl: false
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: data

  flyway:
    enabled: true
    locations: classpath:db/migration/common
    default-schema: data

  main:
    banner-mode: off

server:
  servlet:
    context-path: /${spring.application.name}

jeap:
  web.tls.enabled: false
  swagger:
    status: open
  reaction:
    observer:
      service:
        kafka:
          reaction-identified-topic: jme-reaction-identified
          reactions-observed-topic: jme-reactions-observed
      read-user:
        username: read
        password: "{noop}secret"
      write-user:
        username: write
        password: "{noop}secret"

database-migration:
  startup-migrate-mode-enabled: true
  init-container: false

logging:
  level:
    ch.admin.bit.jeap.reaction: DEBUG
