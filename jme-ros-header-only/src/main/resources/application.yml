spring:
  application:
    name: jme-ros-header-only
  main:
    banner-mode: off

server:
  servlet:
    context-path: /${spring.application.name}

springdoc:
  swagger-ui:
    # Swagger UI lists the API groups by name and would otherwise preselect the first one, "Actuator"
    urls-primary-name: Product API

jeap:
  monitor:
    prometheus:
      password: "{noop}secret"
  swagger:
    status: open
  web:
    tls:
      enabled: false
