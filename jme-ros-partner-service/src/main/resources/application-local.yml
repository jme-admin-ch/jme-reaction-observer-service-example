server:
  port: 8092

logging:
  level:
    # Log how the REST endpoints of this service are called
    ch.admin.bit.jeap.jme.reactionobserver.partner.CreditReservationController: DEBUG

spring:
  datasource:
    url: "jdbc:postgresql://localhost:5434/partner-db"
    username: db-user
    password: db-pass

jeap:
  messaging:
    kafka:
      bootstrapServers: "http://localhost:9092"
      schemaRegistryUrl: "http://localhost:7781"
      username: user
      password: user-secret
      securityProtocol: SASL_PLAINTEXT
  reaction:
    observer:
      events:
        # Report the observed reactions every 10 seconds instead of every 5 minutes, for demos and tests
        observed-event-rate-seconds: 10
