description:
  en:
    localisedName: jme-reaction-observer-service
    shortDescription: Example project demonstrating how to instantiate the jEAP Reaction Observer Service.
    longDescription: >
      The jEAP Reaction Observer Service consumes the reaction events published by the jEAP Reaction
      Observer Library (embedded in each microservice) and aggregates them into a queryable model of
      how services react to incoming messages. It is delivered as a jEAP product
      (jeap-reaction-observer-service-instance) that development teams instantiate per environment.
      This repository provides an example of how to set up and configure a Reaction Observer Service
      instance for local development.
    features:
      - Demonstrates instantiation and configuration of the jEAP Reaction Observer Service
      - Provides Docker Compose setup for local development (PostgreSQL and Kafka)
